<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>404 — Advait Jain</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { height:100%; margin:0; }
  body {
    display:flex; align-items:center; justify-content:center;
    background:#050709; color:#d8d4ce;
    font-family:'JetBrains Mono', ui-monospace, monospace;
    font-size:15px; line-height:1.6;
  }
  main { max-width:32rem; padding:1.5rem; }
  .amber { color:#ffb86c; }
  .dim { color:#6b7585; }
  a { color:#67e8f9; text-decoration:underline; text-underline-offset:2px; }
  a:hover { color:#f472b6; }
  .cursor { display:inline-block; width:8px; height:1em; background:#ffb86c; vertical-align:text-bottom; animation:blink 1.06s steps(2,end) infinite; }
  @keyframes blink { 0%,49.999%{opacity:1} 50%,100%{opacity:0} }
</style>
</head>
<body>
<main>
  <p><span class="dim">$</span> cat <span class="amber">"$1"</span></p>
  <p class="dim">cat: $1: No such file or directory</p>
  <p><span class="dim">$</span> cd ~<span class="cursor"></span></p>
  <p style="margin-top:1.5rem">Nothing lives at this path. <a href="/">Head back to ~</a> and type <code>help</code>.</p>
</main>
</body>
</html>
