  document.documentElement.style.setProperty('--amber', t.phosphor);
  document.documentElement.style.setProperty('--amber-bright', t.bright);
  state.theme = name;

// =================== AUDIO ===================
let audioCtx;
function ensureAudio() {
  if (!audioCtx) { try { audioCtx = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){ audioCtx = null; } }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
function beep(freq, type, gainVal, dur) {
  if (!state.sound) return; ensureAudio(); if (!audioCtx) return;
  const now = audioCtx.currentTime, osc = audioCtx.createOscillator(), g = audioCtx.createGain();
  osc.type = type; osc.frequency.setValueAtTime(freq, now);
  g.gain.setValueAtTime(gainVal, now); g.gain.exponentialRampToValueAtTime(.0001, now+dur);
  osc.connect(g); g.connect(audioCtx.destination); osc.start(now); osc.stop(now+dur+.01);
}
const playClick = () => beep(1700 + Math.random()*500, 'square', .018, .025);
const playBell  = () => beep(760, 'sine', .04, .35);

// =================== MARKDOWN ===================
function inlineMd(t) {
  return t
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/\*([^*\n]+)\*/g,'<em>$1</em>')
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
}
function renderMarkdown(md) {
  const lines = esc(md).split('\n'); const out = [];
  let inUl=false, inOl=false, inCode=false, para=[];
  const flush = () => { if (para.length) { out.push('<p>'+para.join(' ')+'</p>'); para=[]; } };
  const closeLists = () => { if (inUl){out.push('</ul>');inUl=false;} if (inOl){out.push('</ol>');inOl=false;} };
  for (const line of lines) {
    if (/^```/.test(line)) {
      if (inCode) { out.push('</code></pre>'); inCode=false; }
      else { flush(); closeLists(); out.push('<pre><code>'); inCode=true; }
      continue;
    }
    if (inCode) { out.push(line); continue; }
    if (!line.trim()) { flush(); closeLists(); continue; }
    let m;
    if (m = line.match(/^### (.+)$/)) { flush(); closeLists(); out.push('<h3>'+inlineMd(m[1])+'</h3>'); }
    else if (m = line.match(/^## (.+)$/)) { flush(); closeLists(); out.push('<h2>'+inlineMd(m[1])+'</h2>'); }
    else if (m = line.match(/^# (.+)$/)) { flush(); closeLists(); out.push('<h1>'+inlineMd(m[1])+'</h1>'); }
    else if (m = line.match(/^&gt; (.+)$/)) { flush(); closeLists(); out.push('<blockquote>'+inlineMd(m[1])+'</blockquote>'); }
    else if (m = line.match(/^(\d+)\. (.+)$/)) { flush(); if(inUl){out.push('</ul>');inUl=false;} if(!inOl){out.push('<ol>');inOl=true;} out.push('<li>'+inlineMd(m[2])+'</li>'); }
    else if (m = line.match(/^[-*] (.+)$/)) { flush(); if(inOl){out.push('</ol>');inOl=false;} if(!inUl){out.push('<ul>');inUl=true;} out.push('<li>'+inlineMd(m[1])+'</li>'); }
    else if (/^---+$/.test(line)) { flush(); closeLists(); out.push('<div class="divider">'+'─'.repeat(72)+'</div>'); }
    else para.push(inlineMd(line));
  }
  flush(); closeLists(); if (inCode) out.push('</code></pre>');
  return out.join('');
}
const md = s => writeLine('<div class="post">'+renderMarkdown(s)+'</div>');

function tagRow(arr) {
  if (!arr || !arr.length) return '';
  return '<div class="tagrow">'+arr.map(t=>'<span class="tag">'+esc(t)+'</span>').join('')+'</div>';
}
function jobHtml(j) {
  return '<div class="job"><div class="hd">'
    + '<span class="role">'+esc(j.role)+'</span><span class="dim">@</span><span class="co">'+esc(j.company)+'</span>'
    + (j.location ? '<span class="dim">· '+esc(j.location)+'</span>' : '')
    + '<span class="when">'+esc(j.period)+'</span></div>'
    + '<ul>'+j.bullets.map(b=>'<li>'+esc(b)+'</li>').join('')+'</ul>'
    + tagRow(j.stack) + '</div>';
}
function projHtml(p) {
  const title = p.link
    ? '<a class="link" href="'+esc(p.link)+'" target="_blank" rel="noopener noreferrer">'+esc(p.name)+'</a>'
    : '<span class="role">'+esc(p.name)+'</span>';
  return '<div class="job"><div class="hd">'
    + '<span class="role">'+title+'</span><span class="dim">'+esc(p.desc)+'</span>'
    + '<span class="when">'+esc(p.lang||'')+'</span></div>'
    + (p.bullets && p.bullets.length ? '<ul>'+p.bullets.map(b=>'<li>'+esc(b)+'</li>').join('')+'</ul>' : '')
    + '</div>';
}
function sectionHead(t) { writeLine('<span class="amber" style="font-weight:600">'+esc(t)+'</span> '+rule(74-t.length-1)); }

// =================== VIRTUAL FS ===================
function fsRoot() {
  return [
    { name:'experience', type:'dir' },
    { name:'projects', type:'dir' },
    { name:'skills.txt', type:'file', cls:'md' },
    { name:'awards.txt', type:'file', cls:'md' },
    { name:'certifications.txt', type:'file', cls:'md' },
    { name:'education.txt', type:'file', cls:'md' },
    { name:'README.md', type:'file', cls:'md' },
    { name:'.contact', type:'file', cls:'hidden' },
  ];
}
function listDir(p) {
  if (p === '~') return fsRoot();
  if (p === '~/experience') return R.experience.map(j => ({ name:j.id+'.md', type:'file', cls:'md' }));
  if (p === '~/projects') return R.projects.map(x => ({ name:x.id+'.md', type:'file', cls:'md' }));
  return null;
}
const isDir = p => p==='~' || p==='~/experience' || p==='~/projects';
function resolvePath(input) {
  if (!input || input === '~') return '~';
  if (input === '.') return state.cwd;
  if (input === '..') { if (state.cwd === '~') return '~'; const a = state.cwd.split('/'); a.pop(); return a.length===1?'~':a.join('/'); }
  if (input.startsWith('~/')) return input;
  if (input.startsWith('/')) return '~'+input;
  return state.cwd === '~' ? '~/'+input : state.cwd+'/'+input;
}
function catFile(arg) {
  const path = resolvePath(arg), base = path.split('/').pop().replace(/\.md$|\.txt$/,'');
  if (path === '~/README.md') { md(README); return true; }
  if (path === '~/.contact')  { COMMANDS.contact(); return true; }
  if (path === '~/skills.txt'){ COMMANDS.skills(); return true; }
  if (path === '~/education.txt'){ COMMANDS.education(); return true; }
  if (path === '~/awards.txt')   { COMMANDS.awards(); return true; }
  if (path === '~/certifications.txt') { COMMANDS.certifications(); return true; }
  const j = R.experience.find(x => x.id === base);
  if (j) { sectionHead(j.company); writeLine(jobHtml(j)); return true; }
  const p = R.projects.find(x => x.id === base);
  if (p) { sectionHead(p.name); writeLine(projHtml(p)); return true; }
  return false;
}

// grep across every piece of résumé content
function corpus() {
  const rows = [];
  rows.push({ where:'whoami', text:R.name+' — '+R.title+', '+R.location });
  // one grep hit per sentence, not one giant paragraph.
  // ponytail: split on the space AFTER a period rather than a lookbehind —
  // regex lookbehind is a PARSE-time SyntaxError on Safari < 16.4, which
  // would kill this whole script and render a blank page.
  R.summary.replace(/\n+/g,' ').split('. ').forEach((s, i, a) => {
    const t = (i < a.length - 1 ? s + '.' : s).trim();
    if (t) rows.push({ where:'whoami', text:t });
  });
  R.experience.forEach(j => {
    rows.push({ where:'experience/'+j.id, text:j.role+' @ '+j.company+' ('+j.period+')' });
    j.bullets.forEach(b => rows.push({ where:'experience/'+j.id, text:b }));
    if (j.stack) rows.push({ where:'experience/'+j.id, text:'stack: '+j.stack.join(', ') });
  });
  R.projects.forEach(p => {
    rows.push({ where:'projects/'+p.id, text:p.name+' ('+p.lang+') — '+p.desc });
    (p.bullets||[]).forEach(b => rows.push({ where:'projects/'+p.id, text:b }));
  });
  Object.entries(R.skills).forEach(([k,v]) => rows.push({ where:'skills', text:k+': '+v.join(', ') }));
  R.education.forEach(e => rows.push({ where:'education', text:e.degree+', '+e.school+' ('+e.period+')'+(e.notes?' — '+e.notes:'') }));
  R.awards.forEach(a => rows.push({ where:'awards', text:a.what+(a.org?' — '+a.org:'')+(a.note?' — '+a.note:'') }));
  R.certifications.forEach(c => rows.push({ where:'certifications', text:c }));
  return rows;
}
COMMANDS.grep = (args) => {
  const q = args.join(' ').trim();
  if (!q) { writeLine('usage: grep &lt;term&gt;', 'error'); writeLine('example: grep kubernetes', 'dim'); return; }
  const needle = q.toLowerCase();
  const hits = corpus().filter(r => r.text.toLowerCase().includes(needle));
  if (!hits.length) { writeLine('grep: no match for \''+esc(q)+'\'', 'error'); playBell(); return; }
  hits.forEach(r => {
    const i = r.text.toLowerCase().indexOf(needle);
    const marked = esc(r.text.slice(0,i)) + '<span class="hit">' + esc(r.text.slice(i, i+q.length)) + '</span>' + esc(r.text.slice(i+q.length));
    writeLine('<span class="cyan">'+esc(r.where)+'</span><span class="dim">:</span> '+marked);
  });
  writeLine('<span class="dim">'+hits.length+' match'+(hits.length===1?'':'es')+'</span>');
};

function wrapText(text, width) {
  const words = text.split(' ');
  const lines = []; let cur = '';
  for (const w of words) {
    if (cur && (cur + ' ' + w).length > width) { lines.push(cur); cur = w; }
    else cur = cur ? cur + ' ' + w : w;
  }
  if (cur) lines.push(cur);
  return lines;
}

COMMANDS.neofetch = () => {
  const up = fmtUptime(Date.now()-state.bootTime);
  const nSkills = Object.values(R.skills).reduce((n,a)=>n+a.length,0);
  const years = R.experience.length;
  writeLine('<pre class="neofetch pixel">'+PIXEL_ART.join('\n')+'</pre>');
  const fields = [
    { k:'handle',   v: '<span class="green">'+esc(R.handle)+'</span>@<span class="green">resume</span>' },
    { k:'name',     v: esc(R.name) },
    ...wrapText(R.title, 38).map((line,i) => ({ k: i===0 ? 'title' : '', v: esc(line) })),
    { k:'location', v: esc(R.location) },
    { k:'roles',    v: years },
    { k:'projects', v: R.projects.length },
    { k:'skills',   v: nSkills },
    { k:'uptime',   v: up },
    { k:'theme',    v: state.theme },
  ];
  const lines = fields.map(f => f.k ? '<span class="amber">'+f.k.padEnd(9)+'</span>'+f.v : ' '.repeat(9)+f.v);
  writeLine('<pre class="neofetch">'+lines.join('\n')+'</pre>');
};

COMMANDS.theme = (args) => {
  const n = args[0];
  if (!n) { writeLine('available: '+Object.keys(THEMES).join(', '), 'dim'); writeLine('current: '+state.theme, 'success'); return; }
  if (!THEMES[n]) { writeLine('theme: \''+esc(n)+'\' not found. available: '+Object.keys(THEMES).join(', '), 'error'); return; }
  applyTheme(n); writeLine('theme: '+n, 'success');
};
COMMANDS.crt = (args) => {
  state.crt = args[0]==='on' ? true : args[0]==='off' ? false : !state.crt;
  $('crtOverlay').style.opacity = state.crt ? '1' : '0';
  $('statusCrt').textContent = state.crt ? 'on' : 'off';
  writeLine('crt: '+(state.crt?'on':'off'), 'success');
};
COMMANDS.sound = (args) => {
  state.sound = args[0]==='on' ? true : args[0]==='off' ? false : !state.sound;
  $('statusSound').textContent = state.sound ? 'on' : 'off';
  if (state.sound) { ensureAudio(); playClick(); }
  writeLine('sound: '+(state.sound?'on':'off'), 'success');
};

COMMANDS.clear = () => { output.innerHTML = ''; };
COMMANDS.cls = COMMANDS.clear;
COMMANDS.echo = a => writeLine(esc(a.join(' ')));
COMMANDS.date = () => writeLine(new Date().toString());
COMMANDS.history = () => {
  if (!state.history.length) { writeLine('<span class="dim">[empty]</span>'); return; }
  state.history.forEach((c,i) => writeLine('  <span class="dim">'+String(i+1).padStart(3,' ')+'</span>  '+esc(c)));
};

// easter eggs — cheap, and recruiters do try them
COMMANDS.sudo   = () => { writeLine('<span class="error">'+esc(R.handle)+' is not in the sudoers file. This incident will be reported.</span>'); writeLine('<span class="dim">(to grant access, see `contact`)</span>'); };
COMMANDS.hire   = () => { writeLine('<span class="success">✓ availability: open to conversations</span>'); writeLine('<span class="dim">the fastest path is</span> <span class="success">mail</span><span class="dim">.</span>'); };
COMMANDS.exit   = () => writeLine('<span class="dim">there is no escape. this is the only window.</span>');
COMMANDS.logout = COMMANDS.exit;
COMMANDS.vim    = () => { writeLine('<span class="dim">you are already in a terminal. this would be redundant.</span>'); writeLine('<span class="dim">:q!</span>'); };
COMMANDS.rm     = a => writeLine('rm: cannot remove \''+esc(a[0]||'')+'\': Permission denied', 'error');
COMMANDS.npm = COMMANDS.pip = COMMANDS.apt = COMMANDS.brew = () => writeLine('<span class="dim">static site. nothing to install. nice try.</span>');

    grep <term>       search every line of the résumé
    print             clean one-page PDF          (alias: pdf, download)
    mail              open a pre-filled email draft

FILESYSTEM
    ls [path]         list directory contents
    cat <file>        print a file
    cd <dir>          change directory
    pwd               print working directory
    tree              show the whole tree

SETTINGS
    theme [name]      amber | green | cyan | paper
    crt [on|off]      toggle CRT scanlines
    sound [on|off]    toggle keypress sound

MISC
    neofetch, history, date, echo, clear, help, man <cmd>

KEYBOARD
    Tab               autocomplete
    Up / Down         command history
    Right / End       accept ghost suggestion
    Ctrl+L            clear      Ctrl+C   cancel line
    Ctrl+P            print / save as PDF

TIP
    Link straight to a section:  ?c=experience   or   #projects`;

const MAN_PAGES = {
  grep: `GREP(1)\n\nNAME\n    grep - search the résumé\n\nSYNOPSIS\n    grep <term>\n\nDESCRIPTION\n    Case-insensitive substring search across every bullet, skill,\n    role and project description. Prints file:line style results.\n\nEXAMPLES\n    grep kubernetes\n    grep "led a team"`,
  print: `PRINT(1)\n\nNAME\n    print - render a clean one-page résumé\n\nDESCRIPTION\n    Swaps to a print stylesheet (no CRT, black on white, real\n    typography) and opens the browser print dialog. Choose\n    "Save as PDF" to get a file you can attach to an application.\n\n    Ctrl+P does the same thing.`,
  experience: `EXPERIENCE(1)\n\nNAME\n    experience - list roles\n\nSYNOPSIS\n    experience [company]\n\nDESCRIPTION\n    Without arguments, lists every role. With an argument, filters\n    to companies whose name or id contains it.\n\nEXAMPLES\n    experience\n    experience company-a`,
  theme: `THEME(1)\n\nNAME\n    theme - change phosphor color\n\nSYNOPSIS\n    theme [amber|green|cyan|paper]\n\nDESCRIPTION\n    'paper' is the low-drama one, for when a recruiter opens this\n    on a projector. The choice is remembered.`,
};

let typingCancelled = false;
async function typeOut(text, el, delay=3) {
  typingCancelled = false; let buf='';
  for (let i=0;i<text.length;i++) {
    if (typingCancelled) { el.innerHTML = '<pre>'+esc(text)+'</pre>'; scrollBottom(); return; }
    buf += text[i];
    el.innerHTML = '<pre>'+esc(buf)+'</pre>';
    if (i % 6 === 0) scrollBottom();
    if (text[i] === '\n') await sleep(delay*2);
    else if (text[i] !== ' ' && i % 2 === 0) await sleep(delay);
  }
  scrollBottom();
}
function printManPage(text) {
  const d = document.createElement('div');
  d.className = 'line man-page'; output.appendChild(d); scrollBottom();
  typeOut(text, d);
}
COMMANDS.help = (args) => {
  if (args[0]) return COMMANDS.man(args);
  printManPage(HELP_TEXT);
};
COMMANDS.man = (args) => {
  const c = args[0];
  if (!c) { writeLine('What manual page do you want?', 'error'); writeLine('try: man grep, man print, man experience', 'dim'); return; }
  if (MAN_PAGES[c]) printManPage(MAN_PAGES[c]);
  else if (COMMANDS[c]) printManPage(c.toUpperCase()+'(1)\n\nNAME\n    '+c+' - no detailed manual available\n\nDESCRIPTION\n    The command exists. Type \''+c+'\' and find out.');
  else writeLine('man: No manual entry for '+esc(c), 'error');
};

// =================== COMPLETION ===================
function currentWord() {
  const w = cmdInput.value.split(' ');
  return { word:w[w.length-1], isFirst:w.length===1, cmd:w[0] };
}
function candidates(isFirst, cmd) {
  if (isFirst) return Object.keys(COMMANDS);
  if (cmd === 'cat' || cmd === 'ls' || cmd === 'cd') {
    const items = listDir(state.cwd) || [];
    return items.map(i => i.name).concat(state.cwd==='~' ? ['experience','projects','..','~'] : ['..','~']);
  }
  if (cmd === 'man' || cmd === 'help') return [...new Set(Object.keys(MAN_PAGES).concat(Object.keys(COMMANDS)))];
  if (cmd === 'theme') return Object.keys(THEMES);
  if (cmd === 'crt' || cmd === 'sound') return ['on','off'];
  if (cmd === 'experience' || cmd === 'xp' || cmd === 'work') return R.experience.map(j=>j.id);
  if (cmd === 'projects') return R.projects.map(p=>p.id);
  return [];
}
function updateGhost() {
  const { word, isFirst, cmd } = currentWord();
  if (!word) { ghostText.textContent = ''; return; }
  const m = candidates(isFirst, cmd).filter(c => c.toLowerCase().startsWith(word.toLowerCase()));
  if (!m.length) { ghostText.textContent = ''; return; }
  if (m.length === 1) { ghostText.textContent = m[0].slice(word.length); return; }
  let prefix = m[0];
  for (const x of m) while (!x.toLowerCase().startsWith(prefix.toLowerCase())) prefix = prefix.slice(0,-1);
  ghostText.textContent = prefix.length > word.length ? prefix.slice(word.length) : '';
}
function acceptGhost() {
  if (ghostText.textContent) {
    cmdInput.value += ghostText.textContent;
    typedText.textContent = cmdInput.value;
    ghostText.textContent = ''; updateGhost(); playClick(); return;
  }
  const { word, isFirst, cmd } = currentWord();
  if (word) {
    const m = candidates(isFirst, cmd).filter(c => c.toLowerCase().startsWith(word.toLowerCase()));
    if (m.length > 1) { writeLine('<span class="dim">'+m.map(esc).join('    ')+'</span>'); return; }
  }
  playBell();
}

// =================== HISTORY ===================
function navHistory(dir) {
  if (!state.history.length) return;
  if (dir === -1) {
    if (state.historyIndex === -1) state.historyIndex = state.history.length-1;
    else if (state.historyIndex > 0) state.historyIndex--;
    else return;
  } else {
    if (state.historyIndex === -1) return;
    if (state.historyIndex < state.history.length-1) state.historyIndex++;
    else { state.historyIndex = -1; cmdInput.value=''; typedText.textContent=''; ghostText.textContent=''; return; }
  }
  cmdInput.value = state.history[state.historyIndex];
  typedText.textContent = cmdInput.value; ghostText.textContent = ''; updateGhost();
}
function saveHistory(c) {
  if (state.history[state.history.length-1] !== c) state.history.push(c);
  if (state.history.length > 100) state.history.shift();
  state.historyIndex = -1;
  try { localStorage.setItem('rsHistory', JSON.stringify(state.history)); } catch(e){}
}

// =================== PROMPT / SUBMIT ===================
function promptHtml() {
  const p = state.cwd === '~' ? ':~' : ':'+state.cwd;
  return '<span style="color:var(--green)">'+esc(R.handle)+'@resume</span><span class="path">'+p+'</span>$';
}
function updatePrompt() { promptText.innerHTML = promptHtml(); statusPath.textContent = state.cwd; }

function submitCommand(raw) {
  const val = raw.trim();
  writeLine(promptHtml()+' '+esc(val), 'cmd-echo');
  if (!val) return;
  saveHistory(val);
  const [cmd, ...args] = val.split(/\s+/);
  if (COMMANDS[cmd]) {
    try { COMMANDS[cmd](args); }
    catch (e) { writeLine('<span class="error">internal error: '+esc(e.message)+'</span>'); console.error(e); }
  } else {
    writeLine('<span class="error">'+esc(cmd)+': command not found</span>');
    const near = Object.keys(COMMANDS).filter(c => c.startsWith(cmd.slice(0, Math.max(1, cmd.length-2)))).slice(0,3);
    if (near.length) writeLine('<span class="dim">did you mean: '+near.map(s=>'`'+s+'`').join(' / ')+'?</span>');
    writeLine('<span class="dim">type \'help\' for commands.</span>');
    playBell();
  }
}

// =================== INPUT ===================
cmdInput.addEventListener('keydown', e => {
  typingCancelled = true;
  if (e.key === 'Enter') {
    e.preventDefault(); submitCommand(cmdInput.value);
    cmdInput.value=''; typedText.textContent=''; ghostText.textContent=''; playClick();
  } else if (e.key === 'Tab') { e.preventDefault(); acceptGhost(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); navHistory(-1); }
  else if (e.key === 'ArrowDown') { e.preventDefault(); navHistory(1); }
  else if ((e.key === 'ArrowRight' || e.key === 'End') && ghostText.textContent) {
    e.preventDefault(); cmdInput.value += ghostText.textContent;
    typedText.textContent = cmdInput.value; ghostText.textContent=''; updateGhost(); playClick();
  }
  else if (e.key === 'l' && e.ctrlKey) { e.preventDefault(); output.innerHTML=''; }
  else if (e.key === 'c' && e.ctrlKey) {
    e.preventDefault();
    writeLine(promptHtml()+' '+esc(cmdInput.value)+'<span class="error">^C</span>', 'cmd-echo');
    cmdInput.value=''; typedText.textContent=''; ghostText.textContent='';
  }
});
cmdInput.addEventListener('input', () => { typedText.textContent = cmdInput.value; updateGhost(); playClick(); });
cmdInput.addEventListener('paste', () => setTimeout(() => { typedText.textContent = cmdInput.value; updateGhost(); }, 0));
document.querySelector('.terminal').addEventListener('click', () => { if (!window.getSelection().toString()) cmdInput.focus(); });
$('btnPrint').addEventListener('click', () => COMMANDS.print());

// =================== CLOCK ===================
function fmtUptime(ms) {
  const s = Math.floor(ms/1000), h = Math.floor(s/3600), m = Math.floor((s%3600)/60);
  return h ? h+'h '+m+'m' : m ? m+'m '+(s%60)+'s' : s+'s';
}
function tick() {
  const d = new Date(), p = n => String(n).padStart(2,'0');
  statusTime.textContent = p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());
}
setInterval(tick, 1000); tick();

// =================== PRINT VIEW ===================
function buildPrintable() {
  const l = R.links, meta = [R.title, R.location, R.email, R.phone,
    l.github && l.github.replace(/^https?:\/\//,''),
    l.linkedin && l.linkedin.replace(/^https?:\/\//,''),
    l.website && l.website.replace(/^https?:\/\//,''),
    l.blog && l.blog.replace(/^https?:\/\//,'')].filter(Boolean);
  let h = '<h1>'+esc(R.name)+'</h1><div class="meta">'+meta.map(esc).join('  ·  ')+'</div>';
  h += R.summary.split(/\n{2,}/).map(para =>
    '<p>'+esc(para.replace(/^>\s*/,'').replace(/\n/g,' '))+'</p>').join('');
  h += '<h2>Experience</h2>';
  R.experience.forEach(j => {
    h += '<div class="p-job"><div><span class="w">'+esc(j.period)+'</span><span class="r">'+esc(j.role)+'</span> — '+esc(j.company)+(j.location?', '+esc(j.location):'')+'</div>'
       + '<ul>'+j.bullets.map(b=>'<li>'+esc(b)+'</li>').join('')+'</ul>'
       + (j.stack && j.stack.length ? '<div class="p-tags">'+esc(j.stack.join(' · '))+'</div>' : '') + '</div>';
  });
  h += '<h2>Projects</h2>';
  R.projects.forEach(p => {
    h += '<div class="p-job"><div><span class="w">'+esc(p.lang||'')+'</span><span class="r">'+esc(p.name)+'</span> — '+esc(p.desc)+'</div>'
       + ((p.bullets&&p.bullets.length) ? '<ul>'+p.bullets.map(b=>'<li>'+esc(b)+'</li>').join('')+'</ul>' : '')
       + (p.link ? '<div class="p-tags">'+esc(p.link.replace(/^https?:\/\//,''))+'</div>' : '') + '</div>';
  });
  h += '<h2>Skills</h2>';
  Object.entries(R.skills).forEach(([k,v]) => h += '<div><span class="r">'+esc(k)+':</span> '+esc(v.join(', '))+'</div>');
  h += '<h2>Awards &amp; Leadership</h2>';
  R.awards.forEach(a => h += '<div class="p-job"><div>'+(a.period?'<span class="w">'+esc(a.period)+'</span>':'')+'<span class="r">'+esc(a.what)+'</span>'+(a.org?' — '+esc(a.org):'')+'</div>'+(a.note?'<ul><li>'+esc(a.note)+'</li></ul>':'')+'</div>');
  h += '<h2>Certifications</h2><div class="p-tags">'+esc(R.certifications.join(' · '))+'</div>';
  h += '<h2>Education</h2>';
  R.education.forEach(e => h += '<div class="p-job"><div><span class="w">'+esc(e.period)+'</span><span class="r">'+esc(e.degree)+'</span> — '+esc(e.school)+'</div>'+(e.notes?'<ul><li>'+esc(e.notes)+'</li></ul>':'')+'</div>');
  $('printable').innerHTML = h;
}

// =================== BOOT ===================
async function boot() {
  // ponytail: the <title> is already set in the HTML for SEO/social cards.
  // Don't overwrite it here — the browser also uses it as the saved-PDF
  // filename, and "~/resume" makes for an ugly one.
  $('statusUser').textContent = R.handle;
  applyTheme(state.theme);
  updatePrompt();
  buildPrintable();

  const nSkills = Object.values(R.skills).reduce((n,a)=>n+a.length,0);
  const lines = [
    ['[ <span class="ok">OK</span> ] resume shell v1.0 starting…', 70],
    ['[ <span class="ok">OK</span> ] mounting <span class="cyan">/experience</span> <span class="dim">('+R.experience.length+' roles)</span>', 100],
    ['[ <span class="ok">OK</span> ] mounting <span class="cyan">/projects</span> <span class="dim">('+R.projects.length+' entries)</span>', 90],
    ['[ <span class="ok">OK</span> ] indexing skills <span class="dim">('+nSkills+' keywords)</span>', 80],
    ['[ <span class="ok">OK</span> ] loading phosphor drivers <span class="dim">['+state.theme+']</span>', 70],
    ['[ <span class="warn">WARN</span> ] sound off <span class="dim">(type \'sound on\')</span>', 55],
    ['', 90],
  ];
  for (const [t,d] of lines) { writeLine(t, 'boot-line'); await sleep(d); }

  // ponytail: no box art — box-drawing glyphs fall back to a different font
  // and the right border stops lining up. A left rule always lines up.
  writeLine(rule());
  writeLine('  <span class="amber" style="font-weight:600">' + esc(R.name) + '</span> <span class="dim">—</span> ' + esc(R.title) + ' <span class="dim">·</span> ' + esc(R.location));
  printBlank();
  writeLine('  type <span class="success">whoami</span> to start <span class="dim">·</span> <span class="success">resume</span> for everything <span class="dim">·</span> <span class="success">help</span> for all');
  writeLine('  <span class="dim">in a hurry?</span> <span class="success">print</span> <span class="dim">gives you a one-page PDF.</span>');
  writeLine(rule());
  printBlank();

  // deep link: ?c=experience  or  #projects
  const params = new URLSearchParams(location.search);
  const deep = params.get('c') || location.hash.slice(1);
  if (deep) {
    const clean = decodeURIComponent(deep).trim();
    if (clean) { await sleep(200); submitCommand(clean); }
  }
  cmdInput.focus();
}
boot();
</script>
